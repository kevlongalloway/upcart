name = "upcart-provisioning"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat_v2"]

# ─── D1 — tenant registry ─────────────────────────────────────────────────────
# Create with: wrangler d1 create upcart-provisioning-db
# Then apply migrations: wrangler d1 migrations apply upcart-provisioning-db
[[d1_databases]]
binding  = "DB"
database_name = "upcart-provisioning-db"
database_id   = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ─── R2 — compiled store worker bundles ──────────────────────────────────────
# Create with: wrangler r2 bucket create upcart-worker-bundles
# Then upload the backend bundle:
#   cd ../backend && npm run build
#   wrangler r2 object put upcart-worker-bundles/store-worker.js --file dist/index.js
[[r2_buckets]]
binding     = "WORKER_BUNDLES"
bucket_name = "upcart-worker-bundles"

# ─── Public vars ──────────────────────────────────────────────────────────────
[vars]
# Your root domain. Stores are deployed as <subdomain>.<BASE_DOMAIN>
BASE_DOMAIN = "upcart.online"

# Prefix for Worker script names. Each store's worker is named:
#   <WORKER_SCRIPT_PREFIX>-<tenant_id>
WORKER_SCRIPT_PREFIX = "upcart-store"

# R2 object key for the compiled store worker bundle.
# Update this whenever you ship a new backend version.
WORKER_BUNDLE_KEY = "store-worker.js"

# CORS origins for the provisioning API.
# Allow the landing page origin (and local dev).
CORS_ORIGINS = "https://upcart.online,https://www.upcart.online"

# ─── Secrets (set via `wrangler secret put`) ─────────────────────────────────
# The following secrets must be set before deploying:
#
#   wrangler secret put CF_ACCOUNT_ID    (your Cloudflare account ID)
#   wrangler secret put CF_API_TOKEN     (API token with Workers/D1/R2/Zone Edit)
#   wrangler secret put CF_ZONE_ID       (zone ID for upcart.online)
#
# Find your account ID and zone ID in the Cloudflare dashboard.
# Create the API token at: https://dash.cloudflare.com/profile/api-tokens
# Required permissions:
#   - Workers Scripts: Edit
#   - D1: Edit
#   - R2 Storage: Edit
#   - Zone: Workers Routes: Edit
