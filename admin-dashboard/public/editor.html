<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store Editor · Upcart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/editor.css">
</head>
<body>

  <!-- ── Top bar ───────────────────────────────────────────────────────────── -->
  <header class="ed-topbar">
    <div class="ed-topbar-left">
      <a href="/" class="ed-back-btn" id="ed-back" title="Back to Dashboard">
        <i class="bi bi-arrow-left"></i>
      </a>
      <span class="ed-store-name" id="ed-store-name">Store Editor</span>
    </div>

    <div class="ed-topbar-center">
      <div class="ed-vp-toggle" role="group" aria-label="Viewport size">
        <button class="ed-vp-btn active" id="vp-desktop" title="Desktop view">
          <i class="bi bi-display"></i>
        </button>
        <button class="ed-vp-btn" id="vp-tablet" title="Tablet (768px)">
          <i class="bi bi-tablet-landscape"></i>
        </button>
        <button class="ed-vp-btn" id="vp-mobile" title="Mobile (390px)">
          <i class="bi bi-phone"></i>
        </button>
      </div>
    </div>

    <div class="ed-topbar-right">
      <span class="ed-unsaved" id="ed-unsaved" hidden>Unsaved changes</span>
      <button class="ed-btn ed-btn-icon" id="ed-undo" title="Undo (Cmd+Z)" disabled>
        <i class="bi bi-arrow-counterclockwise"></i>
      </button>
      <button class="ed-btn ed-btn-icon" id="ed-redo" title="Redo (Cmd+Shift+Z)" disabled>
        <i class="bi bi-arrow-clockwise"></i>
      </button>
      <a class="ed-btn ed-btn-ghost-sm" id="ed-open-store" href="#" target="_blank" rel="noopener" title="Open live store">
        <i class="bi bi-box-arrow-up-right"></i>
      </a>
      <button class="ed-btn ed-btn-primary" id="ed-save">
        <i class="bi bi-check2"></i> Save
      </button>
    </div>
  </header>

  <!-- ── Editor body ────────────────────────────────────────────────────────── -->
  <div class="ed-body">

    <!-- Left panel: Pages + Sections -->
    <aside class="ed-left" id="ed-left">

      <div class="ed-panel-section">
        <div class="ed-panel-label">Pages</div>
        <div id="ed-page-list" class="ed-nav-list"></div>
      </div>

      <div class="ed-panel-section ed-panel-section--grow">
        <div class="ed-panel-label-row">
          <span class="ed-panel-label" style="margin-bottom:0">Sections</span>
          <button class="ed-icon-btn" id="ed-add-section" title="Add section">
            <i class="bi bi-plus-lg"></i>
          </button>
        </div>
        <div id="ed-section-list" class="ed-nav-list" style="margin-top:6px"></div>
      </div>

      <!-- Add-section popover (anchored to left panel bottom) -->
      <div class="ed-add-popover hidden" id="ed-add-popover" role="menu">
        <div class="ed-add-popover__title">Add section</div>
        <div id="ed-addable-list" class="ed-nav-list"></div>
      </div>

    </aside>

    <!-- Center: live iframe preview -->
    <main class="ed-preview">
      <div class="ed-frame-wrap" id="ed-frame-wrap">
        <iframe id="ed-iframe"
                src="about:blank"
                title="Live store preview"
                sandbox="allow-scripts allow-same-origin allow-forms allow-top-navigation-by-user-activation">
        </iframe>
      </div>
      <!-- No-URL placeholder -->
      <div class="ed-no-url hidden" id="ed-no-url">
        <i class="bi bi-display" style="font-size:36px;display:block;margin-bottom:12px;opacity:.3"></i>
        <p>Store URL not configured.</p>
        <small>Log in via the dashboard to link your store.</small>
      </div>
    </main>

    <!-- Right panel: Properties -->
    <aside class="ed-right" id="ed-right">
      <div id="ed-props"></div>
    </aside>

  </div>

  <!-- Toast notification -->
  <div class="ed-toast" id="ed-toast" role="status" aria-live="polite"></div>

  <script src="/editor.js"></script>
</body>
</html>
