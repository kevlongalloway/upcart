<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop — Demo Store</title>
  <meta property="og:title" content="Shop — Demo Store">
  <meta property="og:description" content="Shop our products">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <!-- theme.js must run before styles to inject CSS vars with zero FOUC.
       store-renderer.js populates #uc-storefront-header / -footer below from
       the same page_sections schema the dashboard editor saves, so the nav
       and footer stay in sync with what the merchant edits at /store-editor/. -->
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="store-renderer.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { max-width: 100%; overflow-x: hidden; }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
    }

    /* Page header */
    .page-header {
      padding: 72px 24px 48px;
      text-align: center;
      border-bottom: 1px solid var(--color-border);
      margin-bottom: 56px;
      overflow: hidden;
    }

    @media (min-width: 640px) { .page-header { padding: 96px 40px 56px; } }

    .page-label {
      font-size: 10px;
      letter-spacing: 0.22em;
      opacity: 0.55;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .page-title {
      font-family: var(--font-display);
      font-size: clamp(40px, 8vw, 76px);
      font-weight: 700;
      line-height: 1.04;
      letter-spacing: -0.01em;
    }

    .product-count {
      font-size: 10px;
      letter-spacing: 0.18em;
      opacity: 0.55;
      margin-top: 22px;
      text-transform: uppercase;
    }

    /* Grid */
    .shop { padding: 0 24px 96px; width: 100%; }

    @media (min-width: 640px) { .shop { padding: 0 40px 120px; } }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
    }

    @media (min-width: 1024px) {
      .grid { grid-template-columns: repeat(4, 1fr); gap: 24px; }
    }

    .card {
      text-decoration: none;
      color: inherit;
      display: block;
      min-width: 0;
      transition: transform .25s ease;
    }

    .card:hover { transform: translateY(-2px); }

    .card-img {
      aspect-ratio: 3/4;
      background: var(--color-surface);
      overflow: hidden;
      border: 1px solid var(--color-surface-border);
      position: relative;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .card:hover .card-img img { transform: scale(1.04); }

    .card-soldout .card-img { position: relative; }
    .card-soldout .card-img img { opacity: 0.5; }

    .soldout-badge {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .soldout-badge span {
      background: rgba(245, 245, 245, 0.92);
      color: #1a1a1a;
      font-size: 8px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 6px 14px;
      border: 1px solid rgba(26, 26, 26, 0.15);
    }

    .card-info { padding: 14px 2px 4px; }

    .card-name {
      display: block;
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 500;
      line-height: 1.25;
      margin-bottom: 6px;
      letter-spacing: 0;
      text-transform: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-price { display: block; font-size: 13px; opacity: 0.7; }

    /* Loading / empty states */
    .state-msg {
      grid-column: 1 / -1;
      text-align: center;
      opacity: 0.5;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 80px 0;
    }

    /* Legacy .footer-* rules removed — the footer is now rendered into
       #uc-storefront-footer by store-renderer.js with its own styles. */
  </style>
</head>
<body>

  <div id="uc-storefront-header"></div>

  <div class="page-header">
    <p class="page-label">All Products</p>
    <h1 class="page-title">Shop</h1>
    <p class="product-count" id="product-count"></p>
  </div>

  <section class="shop">
    <div class="grid" id="products-grid">
      <p class="state-msg">Loading...</p>
    </div>
  </section>

  <div id="uc-storefront-footer"></div>

  <script src="cart.js"></script>
  <script>
    async function loadProducts() {
      const grid    = document.getElementById('products-grid');
      const countEl = document.getElementById('product-count');

      try {
        // Paginate through all products
        let all = [], offset = 0, limit = 100;
        while (true) {
          const res  = await fetch(`${API_BASE}/products?limit=` + limit + '&offset=' + offset);
          const body = await res.json();
          if (!body.ok) throw new Error(body.error);
          if (!body.data.length) break;
          all    = all.concat(body.data);
          offset += body.data.length;
          if (body.data.length < limit) break;
        }
        if (all.length === 0) {
          grid.innerHTML = '<p class="state-msg">No products available.</p>';
          return;
        }
        countEl.textContent = all.length + ' item' + (all.length !== 1 ? 's' : '');
        grid.innerHTML = all.map(product => {
          const image   = product.images && product.images[0] ? product.images[0] : null;
          const soldOut = product.stock === 0;
          return `
          <a href="product.html?id=${product.id}" class="card${soldOut ? ' card-soldout' : ''}">
            <div class="card-img">
              ${image ? `<img src="${image}" alt="${product.name}" loading="lazy">` : ''}
              ${soldOut ? `<div class="soldout-badge"><span>Sold Out</span></div>` : ''}
            </div>
            <div class="card-info">
              <span class="card-name">${product.name}</span>
              <span class="card-price">${formatPrice(product.price, product.currency)}</span>
            </div>
          </a>`;
        }).join('');
      } catch (err) {
        console.error('Failed to load products:', err.message);
        grid.innerHTML = '<p class="state-msg">Error loading products.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>

</body>
</html>
