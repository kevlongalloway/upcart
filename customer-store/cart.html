<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Demo Store</title>
  <!-- theme.js must run before styles to inject CSS vars with zero FOUC -->
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <!-- Stripe.js — loads the Stripe SDK (required for Apple Pay) -->
  <script src="https://js.stripe.com/v3/" async></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      min-height: 100vh;
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 28px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    @media (min-width: 640px) { nav { padding: 28px 40px; } }
    .nav-mark {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-decoration: none;
      color: var(--color-text);
    }
    .nav-links { display: flex; gap: 32px; }
    .nav-links a {
      font-size: 10px;
      color: var(--color-text);
      text-decoration: none;
      letter-spacing: 0.1em;
      opacity: 0.6;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 1; }
    .nav-links a.active { opacity: 1; }

    /* Page */
    .cart-page {
      padding: 120px 24px 80px;
      max-width: 800px;
      margin: 0 auto;
    }
    @media (min-width: 640px) { .cart-page { padding: 120px 40px 80px; } }

    .page-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      opacity: 0.5;
      text-transform: uppercase;
      margin-bottom: 16px;
    }
    .page-title {
      font-family: var(--font-display);
      font-size: clamp(36px, 8vw, 80px);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 48px;
    }

    /* Empty */
    .empty-state { text-align: center; padding: 80px 0; }
    .empty-state p {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.5;
      margin-bottom: 32px;
    }
    .empty-state a {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-text);
      text-decoration: none;
      border-bottom: 1px solid var(--color-border-mid);
      padding-bottom: 2px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .empty-state a:hover { opacity: 1; }

    /* Cart items */
    .cart-items { border-top: 1px solid var(--color-border); }

    .cart-item {
      display: grid;
      grid-template-columns: 72px 1fr auto;
      gap: 20px;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--color-border);
    }

    .cart-item-img {
      aspect-ratio: 3/4;
      background: var(--color-surface);
      overflow: hidden;
      border: 1px solid var(--color-surface-border);
    }
    .cart-item-img img { width: 100%; height: 100%; object-fit: cover; }

    .cart-item-name { font-size: 10px; letter-spacing: 0.05em; margin-bottom: 6px; }
    .cart-item-price { font-size: 10px; opacity: 0.6; margin-bottom: 12px; }

    .qty-row {
      display: flex;
      align-items: center;
      width: fit-content;
      border: 1px solid var(--color-border-mid);
    }
    .qty-btn {
      background: none;
      border: none;
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 14px;
      width: 36px;
      height: 36px;
      opacity: 0.6;
      transition: opacity 0.2s;
    }
    .qty-btn:hover { opacity: 1; }
    .qty-display {
      width: 36px;
      height: 36px;
      text-align: center;
      line-height: 36px;
      font-size: 11px;
      border-left: 1px solid var(--color-border-mid);
      border-right: 1px solid var(--color-border-mid);
    }

    .cart-item-subtotal { font-size: 11px; letter-spacing: 0.05em; text-align: right; }
    .cart-item-remove {
      display: block;
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.4;
      background: none;
      border: none;
      color: var(--color-text);
      font-family: var(--font-body);
      margin-top: 6px;
      transition: opacity 0.2s;
      text-align: right;
    }
    .cart-item-remove:hover { opacity: 0.8; }

    /* Summary */
    .cart-summary {
      margin-top: 40px;
      padding-top: 28px;
      border-top: 1px solid var(--color-border);
    }
    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      opacity: 0.6;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
    }
    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      letter-spacing: 0.05em;
      margin-bottom: 32px;
      padding-top: 12px;
      border-top: 1px solid var(--color-border);
    }
    .summary-total-label { opacity: 0.7; text-transform: uppercase; font-size: 9px; letter-spacing: 0.15em; }

    /* Checkout section */
    .checkout-section { margin-top: 32px; }

    /* Apple Pay / Google Pay button area */
    #payment-request-wrapper { display: none; margin-bottom: 16px; }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 16px 0;
      display: none;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }
    .divider span {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.5;
    }
    #divider { display: none; }

    .btn-checkout {
      width: 100%;
      background: var(--color-btn-bg);
      color: var(--color-btn-text);
      border: 1px solid var(--color-btn-bg);
      font-family: var(--font-body);
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 18px;
      transition: all 0.2s;
      display: block;
      text-align: center;
      text-decoration: none;
    }
    .btn-checkout:hover { opacity: 0.8; }
    .btn-checkout:disabled { opacity: 0.5; cursor: not-allowed; }

    .checkout-note {
      font-size: 9px;
      opacity: 0.4;
      text-align: center;
      letter-spacing: 0.1em;
      margin-top: 16px;
    }

    /* Discount code */
    .discount-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--color-border);
    }
    .discount-label {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 10px;
    }
    .discount-row { display: flex; gap: 8px; }
    .discount-input {
      flex: 1;
      background: none;
      border: 1px solid var(--color-border-mid);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 11px;
      letter-spacing: 0.05em;
      padding: 10px 14px;
      text-transform: uppercase;
    }
    .discount-input:focus { outline: none; border-color: var(--color-text); }
    .discount-input::placeholder { text-transform: none; opacity: 0.5; }
    .discount-apply {
      background: none;
      border: 1px solid var(--color-border-mid);
      color: var(--color-text);
      font-family: var(--font-body);
      font-size: 9px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 10px 18px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .discount-apply:hover { border-color: var(--color-text); }
    .discount-apply:disabled { opacity: 0.5; cursor: not-allowed; }
    .discount-msg { font-size: 9px; letter-spacing: 0.08em; margin-top: 8px; display: none; }
    .discount-msg.success { color: #16a34a; display: block; }
    .discount-msg.error   { color: #dc2626; display: block; }
    .discount-applied-row {
      display: none;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #16a34a;
      margin-top: 8px;
    }
    .discount-applied-row.show { display: flex; }
    .discount-remove {
      background: none;
      border: none;
      font-family: var(--font-body);
      font-size: 9px;
      color: var(--color-text);
      opacity: 0.4;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .discount-remove:hover { opacity: 0.8; }

    /* Error */
    .checkout-error {
      font-size: 9px;
      letter-spacing: 0.1em;
      color: #dc2626;
      text-align: center;
      margin-top: 12px;
      display: none;
    }

    /* Footer */
    footer {
      background: var(--color-footer-bg);
      color: var(--color-footer-text);
      padding: 60px 24px 36px;
    }
    @media (min-width: 640px) { footer { padding: 60px 40px 36px; } }
    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--color-footer-border);
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 24px;
    }
    .footer-brand-name {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 14px;
    }
    footer img { width: 200px; }
    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }
    .footer-links a {
      font-size: 10px;
      color: var(--color-footer-text);
      text-decoration: none;
      letter-spacing: 0.1em;
      opacity: 0.6;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .footer-links a:hover { opacity: 1; }
    .footer-copy { font-size: 9px; opacity: 0.4; letter-spacing: 0.05em; }
  </style>
</head>
<body>

  <nav>
    <a class="nav-mark" href="index.html">Store</a>
    <div class="nav-links">
      <a href="products.html">Shop</a>
      <a href="cart.html" class="active cart-nav-link">Cart</a>
    </div>
  </nav>

  <div class="cart-page">
    <p class="page-label">Your Order</p>
    <h1 class="page-title">Cart</h1>
    <div id="cart-body"></div>
  </div>

  <footer>
    <div class="footer-top">
      <div>
        <p class="footer-brand-name" data-store-name>Your Store</p>
      </div>
      <div class="footer-links">
        <a href="#">Help</a>
        <a href="#">Returns</a>
        <a href="#">Contact</a>
      </div>
    </div>
    <p class="footer-copy">© 2026 <span data-store-name>Your Store</span>. All rights reserved.</p>
  </footer>

  <script src="cart.js"></script>
  <script>
    // ─── DISCOUNT STATE ───────────────────────────────────────────────────────
    let _discount = null; // { code, discount_amount, name, type, is_free_shipping }

    // ─── RENDER CART ──────────────────────────────────────────────────────────
    function renderCart() {
      const cart = getCart();
      const body = document.getElementById('cart-body');

      if (cart.length === 0) {
        _discount = null;
        body.innerHTML = `
          <div class="empty-state">
            <p>Your cart is empty</p>
            <a href="products.html">Continue Shopping →</a>
          </div>`;
        return;
      }

      const currency = cart[0].currency || 'usd';
      const subtotal = getCartTotal();
      const discountAmt = _discount ? _discount.discount_amount : 0;
      const total       = Math.max(0, subtotal - discountAmt);

      body.innerHTML = `
        <div class="cart-items">
          ${cart.map(item => `
            <div class="cart-item" data-id="${item.productId}">
              <div class="cart-item-img">
                ${item.image
                  ? `<img src="${item.image}" alt="${item.name}" loading="lazy">`
                  : ''}
              </div>
              <div>
                <p class="cart-item-name">${item.name}</p>
                <p class="cart-item-price">${formatPrice(item.price, item.currency)}</p>
                <div class="qty-row">
                  <button class="qty-btn" data-action="minus" data-id="${item.productId}">−</button>
                  <span class="qty-display">${item.quantity}</span>
                  <button class="qty-btn" data-action="plus" data-id="${item.productId}">+</button>
                </div>
              </div>
              <div>
                <p class="cart-item-subtotal">${formatPrice(item.price * item.quantity, item.currency)}</p>
                <button class="cart-item-remove" data-id="${item.productId}">Remove</button>
              </div>
            </div>`).join('')}
        </div>

        <!-- Discount code input -->
        <div class="discount-section">
          <p class="discount-label">Promo Code</p>
          <div class="discount-row">
            <input class="discount-input" id="discount-input" type="text"
                   placeholder="Enter code" maxlength="50"
                   value="${_discount ? _discount.code : ''}"
                   ${_discount ? 'disabled' : ''}>
            <button class="discount-apply" id="discount-apply"
                    ${_discount ? 'disabled' : ''}>
              ${_discount ? 'Applied' : 'Apply'}
            </button>
          </div>
          <p class="discount-msg${_discount ? ' success' : ''}" id="discount-msg">
            ${_discount ? `${_discount.name} — ${_discount.is_free_shipping ? 'Free shipping' : formatPrice(_discount.discount_amount, currency) + ' off'}` : ''}
          </p>
          ${_discount ? `
          <div class="discount-applied-row show" id="discount-applied-row">
            <span></span>
            <button class="discount-remove" id="discount-remove">Remove</button>
          </div>` : `<div class="discount-applied-row" id="discount-applied-row"></div>`}
        </div>

        <div class="cart-summary">
          <div class="summary-row">
            <span>Subtotal</span>
            <span>${formatPrice(subtotal, currency)}</span>
          </div>
          ${discountAmt > 0 ? `
          <div class="summary-row" style="color:#16a34a">
            <span>${_discount.name}${_discount.code ? ` (${_discount.code})` : ''}</span>
            <span>−${formatPrice(discountAmt, currency)}</span>
          </div>` : ''}
          ${_discount && _discount.is_free_shipping ? `
          <div class="summary-row" style="color:#16a34a">
            <span>Shipping</span>
            <span>Free</span>
          </div>` : `
          <div class="summary-row">
            <span>Shipping</span>
            <span>Calculated at checkout</span>
          </div>`}
          <div class="summary-total">
            <span class="summary-total-label">Total</span>
            <span>${formatPrice(total, currency)}</span>
          </div>
        </div>

        <div class="checkout-section">
          <!-- Apple Pay / Google Pay button — shown only when available -->
          <div id="payment-request-wrapper">
            <div id="payment-request-button"></div>
          </div>
          <div id="divider" class="divider"><span>or</span></div>

          <!-- Stripe-hosted checkout (supports Apple Pay on Stripe's page too) -->
          <button class="btn-checkout" id="btn-checkout">Checkout</button>
          <p class="checkout-error" id="checkout-error"></p>
          <p class="checkout-note">Secure checkout via Stripe</p>
        </div>`;

      // Quantity / remove event listeners
      body.querySelectorAll('.qty-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id   = btn.dataset.id;
          const item = getCart().find(i => i.productId === id);
          if (!item) return;
          if (btn.dataset.action === 'minus') setQuantity(id, item.quantity - 1);
          else setQuantity(id, item.quantity + 1);
        });
      });
      body.querySelectorAll('.cart-item-remove').forEach(btn => {
        btn.addEventListener('click', () => {
          _discount = null; // reset discount when cart changes
          removeFromCart(btn.dataset.id);
        });
      });

      // Discount code listeners
      const discountInput  = document.getElementById('discount-input');
      const discountApply  = document.getElementById('discount-apply');
      const discountMsg    = document.getElementById('discount-msg');
      const discountRemove = document.getElementById('discount-remove');

      if (discountInput) {
        discountInput.addEventListener('input', () => {
          discountInput.value = discountInput.value.toUpperCase();
        });
      }

      if (discountApply) {
        discountApply.addEventListener('click', async () => {
          const code = (discountInput?.value ?? '').trim();
          if (!code) return;

          discountApply.disabled    = true;
          discountApply.textContent = '…';
          discountMsg.className     = 'discount-msg';
          discountMsg.textContent   = '';

          const cart  = getCart();
          const items = cart.map(i => ({ productId: i.productId, price: i.price, quantity: i.quantity }));

          try {
            const res  = await fetch(`${API_BASE}/discounts/validate`, {
              method:  'POST',
              headers: { 'Content-Type': 'application/json' },
              body:    JSON.stringify({ code, items }),
            });
            const body = await res.json();
            if (!body.ok) throw new Error(body.error || 'Validation failed');

            if (!body.data.valid) {
              discountMsg.className   = 'discount-msg error';
              discountMsg.textContent = body.data.error || 'Invalid discount code';
              discountApply.disabled  = false;
              discountApply.textContent = 'Apply';
            } else {
              _discount = {
                code:             body.data.discount.code,
                name:             body.data.discount.name,
                discount_amount:  body.data.discount_amount,
                is_free_shipping: body.data.is_free_shipping || body.data.discount?.type === 'free_shipping',
              };
              renderCart(); // re-render with discount applied
            }
          } catch (err) {
            discountMsg.className   = 'discount-msg error';
            discountMsg.textContent = err.message;
            discountApply.disabled  = false;
            discountApply.textContent = 'Apply';
          }
        });
      }

      if (discountRemove) {
        discountRemove.addEventListener('click', () => {
          _discount = null;
          renderCart();
        });
      }

      // Checkout button
      document.getElementById('btn-checkout').addEventListener('click', hostedCheckout);

      // Init Apple Pay button
      initPaymentRequest(cart, subtotal, currency);
    }

    // ─── STRIPE PAYMENT REQUEST BUTTON (Apple Pay / Google Pay) ───────────────
    // This shows a native Apple Pay sheet on Safari/iOS and Google Pay on Chrome.
    //
    // IMPORTANT — Apple Pay domain verification:
    // For Apple Pay to work on your own domain you must verify it in the Stripe
    // Dashboard: Settings → Payment methods → Apple Pay → Add domain.
    // Stripe will give you a file to host at:
    //   /.well-known/apple-developer-merchantid-domain-association
    // On Render (static site), add this file to the root of your repo.
    //
    async function initPaymentRequest(cart, amount, currency) {
      // Wait for Stripe.js to load (it loads async)
      let attempts = 0;
      while (typeof Stripe === 'undefined' && attempts < 20) {
        await new Promise(r => setTimeout(r, 200));
        attempts++;
      }
      if (typeof Stripe === 'undefined') return;

      try {
        // Create a payment intent to get the publishable key
        const items = cart.map(i => ({ productId: i.productId, quantity: i.quantity }));
        const res   = await fetch(`${API_BASE}/checkout/intent`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ items }),
        });
        const body = await res.json();
        if (!body.ok) return; // Stripe not configured yet, skip silently

        const { clientSecret, publishableKey, amount: intentAmount, currency: intentCurrency } = body.data;

        const stripe = Stripe(publishableKey);

        const pr = stripe.paymentRequest({
          country:           'US',
          currency:          intentCurrency,
          total:             { label: 'Demo Store', amount: intentAmount },
          requestPayerName:  true,
          requestPayerEmail: true,
        });

        const elements = stripe.elements();
        const prButton = elements.create('paymentRequestButton', {
          paymentRequest: pr,
          style: {
            paymentRequestButton: {
              type:   'buy',
              theme:  'dark',
              height: '52px',
            },
          },
        });

        const result = await pr.canMakePayment();
        if (result) {
          // Apple Pay or Google Pay is available — show the button
          const wrapper = document.getElementById('payment-request-wrapper');
          const divider = document.getElementById('divider');
          if (wrapper) wrapper.style.display = 'block';
          if (divider) divider.style.display  = 'flex';
          prButton.mount('#payment-request-button');
        }

        // Handle the native payment sheet completion
        pr.on('paymentmethod', async (ev) => {
          const { error: confirmError, paymentIntent } = await stripe.confirmCardPayment(
            clientSecret,
            { payment_method: ev.paymentMethod.id },
            { handleActions: false }
          );

          if (confirmError) {
            ev.complete('fail');
            showCheckoutError(confirmError.message);
            return;
          }

          ev.complete('success');

          if (paymentIntent.status === 'requires_action') {
            const { error } = await stripe.confirmCardPayment(clientSecret);
            if (error) { showCheckoutError(error.message); return; }
          }

          clearCart();
          window.location.href = 'success.html';
        });

      } catch (err) {
        console.warn('Payment Request init failed:', err.message);
      }
    }

    // ─── STRIPE HOSTED CHECKOUT ───────────────────────────────────────────────
    async function hostedCheckout() {
      const btn = document.getElementById('btn-checkout');
      btn.disabled = true;
      btn.textContent = 'Redirecting…';
      hideCheckoutError();

      const cart  = getCart();
      const items = cart.map(i => ({ productId: i.productId, quantity: i.quantity }));

      try {
        const res  = await fetch(`${API_BASE}/checkout/session`, {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({
            items,
            successUrl:   window.location.origin + '/success.html?session_id={CHECKOUT_SESSION_ID}',
            cancelUrl:    window.location.href,
            ...(_discount?.code ? { discountCode: _discount.code } : {}),
          }),
        });
        const body = await res.json();
        if (!body.ok) throw new Error(body.error || 'Checkout failed');
        window.location.href = body.data.url;
      } catch (err) {
        showCheckoutError(err.message);
        btn.disabled    = false;
        btn.textContent = 'Checkout';
      }
    }

    function showCheckoutError(msg) {
      const el = document.getElementById('checkout-error');
      if (el) { el.textContent = msg; el.style.display = 'block'; }
    }
    function hideCheckoutError() {
      const el = document.getElementById('checkout-error');
      if (el) el.style.display = 'none';
    }

    // ─── OUT-OF-STOCK GUARD ───────────────────────────────────────────────────
    async function checkStockForCheckout() {
      const cart = getCart();
      if (cart.length === 0) return;

      const btn = document.getElementById('btn-checkout');
      if (!btn) return;

      try {
        const results = await Promise.all(
          cart.map(item =>
            fetch(`${API_BASE}/products/` + item.productId)
              .then(r => r.json())
              .catch(() => null)
          )
        );

        const allOutOfStock = results.every(body => {
          if (!body || !body.ok) return false;
          const p = body.data;
          return p.stock === 0;
        });

        if (allOutOfStock) {
          btn.disabled    = true;
          btn.textContent = 'Out of Stock';
          showCheckoutError('All items in your cart are currently out of stock.');
        }
      } catch {
        // Non-critical — ignore stock check errors
      }
    }

    // ─── INIT ─────────────────────────────────────────────────────────────────
    window.addEventListener('bst:cart-updated', renderCart);
    document.addEventListener('DOMContentLoaded', () => {
      renderCart();
      checkStockForCheckout();
    });
  </script>

</body>
</html>
