<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Demo Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <!-- theme.js + store-renderer.js render the merchant-edited header/footer
       chrome into the slot divs in <body> below. -->
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="store-renderer.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f5f5f5;
      color: #1a1a1a;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Main */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 56px 24px 80px;
    }
    @media (min-width: 640px) { main { padding: 64px 40px 80px; } }

    .confirmation {
      max-width: 520px;
      width: 100%;
    }

    .check-icon {
      width: 56px;
      height: 56px;
      border: 2px solid #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }
    .check-icon svg {
      width: 24px;
      height: 24px;
      stroke: #1a1a1a;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      opacity: 0.5;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .page-title {
      font-family: 'Space Mono', monospace;
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 24px;
    }

    .confirmation-msg {
      font-size: 10px;
      line-height: 1.8;
      opacity: 0.6;
      margin-bottom: 40px;
      max-width: 380px;
    }

    .session-id {
      font-size: 9px;
      letter-spacing: 0.05em;
      opacity: 0.4;
      margin-bottom: 40px;
      word-break: break-all;
    }

    .btn-continue {
      display: inline-block;
      background: #1a1a1a;
      color: #f5f5f5;
      border: 1px solid #1a1a1a;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 16px 40px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-continue:hover { opacity: 0.8; }

  </style>
</head>
<body>

  <div id="uc-storefront-header"></div>

  <main>
    <div class="confirmation">
      <div class="check-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="page-label">Payment Successful</p>
      <h1 class="page-title">Order<br>Confirmed</h1>
      <p class="confirmation-msg">
        Thank you for your purchase. You'll receive a confirmation email shortly
        with your order details and tracking information once your items ship.
      </p>
      <p class="session-id" id="session-id-display"></p>
      <a href="products.html" class="btn-continue">Continue Shopping →</a>
    </div>
  </main>

  <div id="uc-storefront-footer"></div>

  <script src="cart.js"></script>
  <script>
    // Clear the cart — payment was successful
    clearCart();

    // Show the Stripe session ID for reference
    const params    = new URLSearchParams(location.search);
    const sessionId = params.get('session_id');
    if (sessionId) {
      document.getElementById('session-id-display').textContent = 'Order ref: ' + sessionId;
    }
  </script>

</body>
</html>
