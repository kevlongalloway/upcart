<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed — Demo Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f5f5f5;
      color: #1a1a1a;
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 28px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    @media (min-width: 640px) { nav { padding: 28px 40px; } }

    .nav-mark {
      font-family: 'Space Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-decoration: none;
      color: #1a1a1a;
    }
    .nav-links { display: flex; gap: 32px; }
    .nav-links a {
      font-size: 10px;
      color: #1a1a1a;
      text-decoration: none;
      letter-spacing: 0.1em;
      opacity: 0.6;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 1; }

    /* Main */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 120px 24px 80px;
    }
    @media (min-width: 640px) { main { padding: 120px 40px 80px; } }

    .confirmation {
      max-width: 520px;
      width: 100%;
    }

    .check-icon {
      width: 56px;
      height: 56px;
      border: 2px solid #1a1a1a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }
    .check-icon svg {
      width: 24px;
      height: 24px;
      stroke: #1a1a1a;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .page-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      opacity: 0.5;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .page-title {
      font-family: 'Space Mono', monospace;
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 24px;
    }

    .confirmation-msg {
      font-size: 10px;
      line-height: 1.8;
      opacity: 0.6;
      margin-bottom: 40px;
      max-width: 380px;
    }

    .session-id {
      font-size: 9px;
      letter-spacing: 0.05em;
      opacity: 0.4;
      margin-bottom: 40px;
      word-break: break-all;
    }

    .btn-continue {
      display: inline-block;
      background: #1a1a1a;
      color: #f5f5f5;
      border: 1px solid #1a1a1a;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 16px 40px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn-continue:hover { opacity: 0.8; }

    /* Footer */
    footer {
      background: #2a2a2a;
      color: #f5f5f5;
      padding: 60px 24px 36px;
    }
    @media (min-width: 640px) { footer { padding: 60px 40px 36px; } }
    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 40px;
      border-bottom: 1px solid rgba(245,245,245,0.1);
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 24px;
    }
    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }
    .footer-links a {
      font-size: 10px;
      color: #f5f5f5;
      text-decoration: none;
      letter-spacing: 0.1em;
      opacity: 0.6;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .footer-links a:hover { opacity: 1; }
    .footer-copy { font-size: 9px; opacity: 0.4; letter-spacing: 0.05em; }
  </style>
</head>
<body>

  <nav>
    <a class="nav-mark" href="index.html">Store</a>
    <div class="nav-links">
      <a href="products.html">Shop</a>
      <a href="cart.html" class="cart-nav-link">Cart</a>
    </div>
  </nav>

  <main>
    <div class="confirmation">
      <div class="check-icon">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <p class="page-label">Payment Successful</p>
      <h1 class="page-title">Order<br>Confirmed</h1>
      <p class="confirmation-msg">
        Thank you for your purchase. You'll receive a confirmation email shortly
        with your order details and tracking information once your items ship.
      </p>
      <p class="session-id" id="session-id-display"></p>
      <a href="products.html" class="btn-continue">Continue Shopping →</a>
    </div>
  </main>

  <footer>
    <div class="footer-top">
      <div>
        <p style="font-family: 'Space Mono', monospace; font-weight: 700; font-size: 14px;" data-store-name>Your Store</p>
      </div>
      <div class="footer-links">
        <a href="#">Help</a>
        <a href="#">Returns</a>
        <a href="#">Contact</a>
      </div>
    </div>
    <p class="footer-copy">© 2026 <span data-store-name>Your Store</span>. All rights reserved.</p>
  </footer>

  <script src="config.js"></script>
  <script src="cart.js"></script>
  <script>
    // Clear the cart — payment was successful
    clearCart();

    // Show the Stripe session ID for reference
    const params    = new URLSearchParams(location.search);
    const sessionId = params.get('session_id');
    if (sessionId) {
      document.getElementById('session-id-display').textContent = 'Order ref: ' + sessionId;
    }
  </script>

</body>
</html>
