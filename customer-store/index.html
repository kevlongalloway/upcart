<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Store</title>
  <meta property="og:title" content="Demo Store">
  <meta property="og:description" content="A modern e-commerce demo store">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <!-- theme.js must run before styles to inject CSS vars with zero FOUC -->
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { overflow-x: hidden; }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      overflow-x: hidden;
      width: 100%;
    }

    /* Nav */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 28px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-mark {
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .nav-links { display: flex; gap: 32px; }

    .nav-links a {
      font-size: 10px;
      color: var(--color-text);
      text-decoration: none;
      letter-spacing: 0.1em;
      opacity: 0.6;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .nav-links a:hover { opacity: 1; }

    /* Hero */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .hero-logo {
      font-family: var(--font-hero);
      font-size: clamp(48px, 15vw, 120px);
      letter-spacing: 0.1em;
      font-weight: 700;
    }

    .hero-sub {
      font-size: 10px;
      letter-spacing: 0.3em;
      opacity: 0.5;
      margin-top: 40px;
      text-transform: uppercase;
    }

    .scroll-hint {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 0.3em;
      opacity: 0.35;
      text-transform: uppercase;
    }

    /* Ticker */
    .ticker {
      overflow: hidden;
      background: var(--color-ticker-bg);
      padding: 11px 0;
      white-space: nowrap;
    }

    .ticker-inner {
      display: inline-flex;
      animation: tick 18s linear infinite;
    }

    .ticker-item {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--color-ticker-text);
      padding: 0 32px;
      letter-spacing: 0.1em;
    }

    @keyframes tick {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }

    /* Shop section */
    .shop { padding: 80px 24px; }

    @media (min-width: 640px) { .shop { padding: 100px 40px; } }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 40px;
    }

    .shop-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      opacity: 0.5;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .shop-title {
      font-family: var(--font-display);
      font-size: clamp(36px, 8vw, 80px);
      font-weight: 700;
      line-height: 1;
    }

    .shop-all-link {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-text);
      text-decoration: none;
      opacity: 0.6;
      border-bottom: 1px solid var(--color-border-mid);
      padding-bottom: 2px;
      white-space: nowrap;
      transition: opacity 0.2s;
      flex-shrink: 0;
      margin-bottom: 6px;
    }

    .shop-all-link:hover { opacity: 1; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }

    .card { text-decoration: none; color: inherit; display: block; }

    .card-img {
      aspect-ratio: 3/4;
      background: var(--color-surface);
      overflow: hidden;
      border: 1px solid var(--color-surface-border);
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover .card-img img { transform: scale(1.04); }

    .card-info { padding: 12px 2px 4px; }

    .card-name {
      display: block;
      font-size: 10px;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-price { display: block; font-size: 10px; opacity: 0.6; }

    /* Shop all CTA */
    .shop-cta { margin-top: 48px; text-align: center; }

    .shop-cta-btn {
      display: inline-block;
      font-family: var(--font-body);
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-btn-text);
      background: var(--color-btn-bg);
      text-decoration: none;
      padding: 14px 36px;
      border: 1px solid var(--color-btn-bg);
      transition: all 0.2s;
    }

    .shop-cta-btn:hover {
      background: var(--color-bg);
      color: var(--color-text);
      border-color: var(--color-border-mid);
    }

    /* Footer */
    footer {
      background: var(--color-footer-bg);
      color: var(--color-footer-text);
      padding: 60px 24px 36px;
    }

    @media (min-width: 640px) { footer { padding: 60px 40px 36px; } }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--color-footer-border);
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 24px;
    }

    .footer-brand-name {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 14px;
    }

    footer img { width: 200px; }

    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }

    .footer-links a {
      font-size: 10px;
      color: var(--color-footer-text);
      text-decoration: none;
      letter-spacing: 0.1em;
      opacity: 0.6;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .footer-links a:hover { opacity: 1; }

    .footer-copy { font-size: 9px; opacity: 0.4; letter-spacing: 0.05em; }
  </style>
</head>
<body>

  <nav>
    <span class="nav-mark">Store</span>
    <div class="nav-links">
      <a href="products.html">Shop</a>
      <a href="cart.html" class="cart-nav-link">Cart</a>
    </div>
  </nav>

  <section class="hero">
    <div class="hero-logo" aria-label="Demo Store">
      Demo Store
    </div>
    <p class="hero-sub">Explore our products</p>
    <span class="scroll-hint">Scroll</span>
  </section>

  <div class="ticker">
    <div class="ticker-inner">
      <span class="ticker-item">DEMO STORE</span><span class="ticker-item">•</span>
      <span class="ticker-item">FAST SHIPPING</span><span class="ticker-item">•</span>
      <span class="ticker-item">SECURE CHECKOUT</span><span class="ticker-item">•</span>
      <span class="ticker-item">DEMO STORE</span><span class="ticker-item">•</span>
      <span class="ticker-item">FAST SHIPPING</span><span class="ticker-item">•</span>
      <span class="ticker-item">SECURE CHECKOUT</span><span class="ticker-item">•</span>
    </div>
  </div>

  <section class="shop">
    <div class="shop-header">
      <div>
        <p class="shop-label">Featured Items</p>
        <h2 class="shop-title">Shop</h2>
      </div>
      <a href="products.html" class="shop-all-link">View all →</a>
    </div>

    <div class="grid" id="products-grid"></div>

    <div class="shop-cta">
      <a href="products.html" class="shop-cta-btn">Browse All Products</a>
    </div>
  </section>

  <footer>
    <div class="footer-top">
      <div>
        <p class="footer-brand-name">Demo Store</p>
      </div>
      <div class="footer-links">
        <a href="#">Help</a>
        <a href="#">Returns</a>
        <a href="#">Contact</a>
      </div>
    </div>
    <p class="footer-copy">© 2026 Demo Store. All rights reserved.</p>
  </footer>

  <script src="cart.js"></script>
  <script>
    // Show payment success toast if redirected back from Stripe
    (function checkPaymentSuccess() {
      const params = new URLSearchParams(location.search);
      if (params.get('payment') === 'success') {
        clearCart();
        history.replaceState({}, '', location.pathname);
        const toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);' +
          'background:var(--color-footer-bg);color:var(--color-footer-text);' +
          'font-family:var(--font-body);font-size:10px;letter-spacing:0.1em;' +
          'text-transform:uppercase;padding:14px 28px;z-index:999;white-space:nowrap;' +
          'transition:opacity 0.5s';
        toast.textContent = 'Order confirmed — thank you!';
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; }, 3500);
        setTimeout(() => toast.remove(), 4200);
      }
    })();

    async function loadProducts() {
      const grid = document.getElementById('products-grid');
      try {
        const res  = await fetch('https://ecommaxxing.kevlongalloway1999m.workers.dev/products?limit=6');
        const body = await res.json();
        if (!body.ok) throw new Error(body.error);
        const products = body.data.slice(0, 6);
        if (products.length === 0) {
          grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;opacity:0.5;">No products available.</p>';
          return;
        }
        grid.innerHTML = products.map(product => {
          const image = product.images && product.images[0] ? product.images[0] : null;
          return `
          <a href="product.html?id=${product.id}" class="card">
            <div class="card-img">
              ${image ? `<img src="${image}" alt="${product.name}" loading="lazy">` : ''}
            </div>
            <div class="card-info">
              <span class="card-name">${product.name}</span>
              <span class="card-price">${formatPrice(product.price, product.currency)}</span>
            </div>
          </a>`;
        }).join('');
      } catch (err) {
        console.error('Failed to load products:', err.message);
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;opacity:0.5;">Error loading products.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>

</body>
</html>
