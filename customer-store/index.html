<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Store</title>
  <meta property="og:title" content="Demo Store">
  <meta property="og:description" content="A modern e-commerce demo store">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <!-- theme.js must run before styles to inject CSS vars with zero FOUC -->
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { overflow-x: hidden; }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      overflow-x: hidden;
      width: 100%;
    }

    /* Nav */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0 24px;
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
    }

    @media (min-width: 640px) { nav { padding: 0 40px; } }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--color-text);
    }

    .nav-logo-img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
      display: none;
    }

    .nav-logo-img.has-logo { display: block; }

    .nav-mark {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .nav-links { display: flex; gap: 8px; align-items: center; }

    .nav-links a {
      font-size: 13px;
      color: var(--color-text);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 4px;
      opacity: 0.7;
      transition: opacity 0.15s, background 0.15s;
    }

    .nav-links a:hover { opacity: 1; background: var(--color-surface); }

    .nav-cart-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      background: var(--color-btn-bg);
      color: var(--color-btn-text);
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .nav-cart-btn:hover { opacity: 0.85; }

    /* Hero banner — Shopify-style, no full-viewport takeover */
    .hero {
      background: var(--color-surface);
      padding: 80px 24px 72px;
      display: flex;
      align-items: center;
      min-height: 420px;
    }

    @media (min-width: 640px) { .hero { padding: 100px 40px 88px; min-height: 480px; } }

    .hero-content { max-width: 560px; }

    .hero-title {
      font-family: var(--font-hero);
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }

    .hero-subtitle {
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.6;
      opacity: 0.65;
      margin-bottom: 32px;
      max-width: 440px;
    }

    .hero-btn {
      display: inline-block;
      background: var(--color-btn-bg);
      color: var(--color-btn-text);
      padding: 13px 28px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.01em;
      border: 2px solid var(--color-btn-bg);
      border-radius: 4px;
      transition: opacity 0.15s;
    }

    .hero-btn:hover { opacity: 0.85; }

    /* Shop section */
    .shop { padding: 80px 24px; }

    @media (min-width: 640px) { .shop { padding: 100px 40px; } }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 40px;
    }

    .shop-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      opacity: 0.5;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .shop-title {
      font-family: var(--font-display);
      font-size: clamp(36px, 8vw, 80px);
      font-weight: 700;
      line-height: 1;
    }

    .shop-all-link {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-text);
      text-decoration: none;
      opacity: 0.6;
      border-bottom: 1px solid var(--color-border-mid);
      padding-bottom: 2px;
      white-space: nowrap;
      transition: opacity 0.2s;
      flex-shrink: 0;
      margin-bottom: 6px;
    }

    .shop-all-link:hover { opacity: 1; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }

    .card { text-decoration: none; color: inherit; display: block; }

    .card-img {
      aspect-ratio: 3/4;
      background: var(--color-surface);
      overflow: hidden;
      border: 1px solid var(--color-surface-border);
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover .card-img img { transform: scale(1.04); }

    .card-info { padding: 12px 2px 4px; }

    .card-name {
      display: block;
      font-size: 10px;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-price { display: block; font-size: 10px; opacity: 0.6; }

    /* Shop all CTA */
    .shop-cta { margin-top: 48px; text-align: center; }

    .shop-cta-btn {
      display: inline-block;
      font-family: var(--font-body);
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-btn-text);
      background: var(--color-btn-bg);
      text-decoration: none;
      padding: 14px 36px;
      border: 1px solid var(--color-btn-bg);
      transition: all 0.2s;
    }

    .shop-cta-btn:hover {
      background: var(--color-bg);
      color: var(--color-text);
      border-color: var(--color-border-mid);
    }

    /* Footer */
    footer {
      background: var(--color-footer-bg);
      color: var(--color-footer-text);
      padding: 60px 24px 36px;
    }

    @media (min-width: 640px) { footer { padding: 60px 40px 36px; } }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--color-footer-border);
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 24px;
    }

    .footer-brand-name {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 14px;
    }

    footer img { width: 200px; }

    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }

    .footer-links a {
      font-size: 10px;
      color: var(--color-footer-text);
      text-decoration: none;
      letter-spacing: 0.1em;
      opacity: 0.6;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .footer-links a:hover { opacity: 1; }

    .footer-copy { font-size: 9px; opacity: 0.4; letter-spacing: 0.05em; }
  </style>
</head>
<body>

  <nav aria-label="Main navigation">
    <a class="nav-logo" href="index.html" aria-label="Store home">
      <img class="nav-logo-img" id="nav-logo-img" data-store-logo alt="">
      <span class="nav-mark" data-store-name>Your Store</span>
    </a>
    <div class="nav-links">
      <a href="products.html">Shop</a>
      <a href="cart.html" class="nav-cart-btn cart-nav-link" aria-label="Cart">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        Cart
      </a>
    </div>
  </nav>

  <section class="hero" aria-label="Store banner">
    <div class="hero-content">
      <h1 class="hero-title" data-hero-title>Your Store</h1>
      <p class="hero-subtitle" data-hero-subtitle>Explore our curated collection</p>
      <a href="products.html" class="hero-btn" data-hero-cta>Shop Now</a>
    </div>
  </section>

  <section class="shop">
    <div class="shop-header">
      <div>
        <p class="shop-label">Featured</p>
        <h2 class="shop-title">New Arrivals</h2>
      </div>
      <a href="products.html" class="shop-all-link">View all →</a>
    </div>

    <div class="grid" id="products-grid"></div>

    <div class="shop-cta">
      <a href="products.html" class="shop-cta-btn">Browse All Products</a>
    </div>
  </section>

  <footer>
    <div class="footer-top">
      <div>
        <p class="footer-brand-name" data-store-name>Your Store</p>
      </div>
      <div class="footer-links">
        <a href="#">Help</a>
        <a href="#">Returns</a>
        <a href="#">Contact</a>
      </div>
    </div>
    <p class="footer-copy">© 2026 <span data-store-name>Your Store</span>. All rights reserved.</p>
  </footer>

  <script src="cart.js"></script>
  <script>
    // Show payment success toast if redirected back from Stripe
    (function checkPaymentSuccess() {
      const params = new URLSearchParams(location.search);
      if (params.get('payment') === 'success') {
        clearCart();
        history.replaceState({}, '', location.pathname);
        const toast = document.createElement('div');
        toast.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);' +
          'background:var(--color-footer-bg);color:var(--color-footer-text);' +
          'font-family:var(--font-body);font-size:10px;letter-spacing:0.1em;' +
          'text-transform:uppercase;padding:14px 28px;z-index:999;white-space:nowrap;' +
          'transition:opacity 0.5s';
        toast.textContent = 'Order confirmed — thank you!';
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; }, 3500);
        setTimeout(() => toast.remove(), 4200);
      }
    })();

    async function loadProducts() {
      const grid = document.getElementById('products-grid');
      try {
        const res  = await fetch(`${API_BASE}/products?limit=6`);
        const body = await res.json();
        if (!body.ok) throw new Error(body.error);
        const products = body.data.slice(0, 6);
        if (products.length === 0) {
          grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;opacity:0.5;">No products available.</p>';
          return;
        }
        grid.innerHTML = products.map(product => {
          const image = product.images && product.images[0] ? product.images[0] : null;
          return `
          <a href="product.html?id=${product.id}" class="card">
            <div class="card-img">
              ${image ? `<img src="${image}" alt="${product.name}" loading="lazy">` : ''}
            </div>
            <div class="card-info">
              <span class="card-name">${product.name}</span>
              <span class="card-price">${formatPrice(product.price, product.currency)}</span>
            </div>
          </a>`;
        }).join('');
      } catch (err) {
        console.error('Failed to load products:', err.message);
        grid.innerHTML = '<p style="grid-column:1/-1;text-align:center;opacity:0.5;">Error loading products.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>

</body>
</html>
