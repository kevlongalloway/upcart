<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Store</title>
  <meta property="og:title" content="Demo Store">
  <meta property="og:description" content="A modern e-commerce demo store">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <!-- theme.js must run before styles to inject CSS vars with zero FOUC -->
  <script src="config.js"></script>
  <script src="theme.js"></script>
  <script src="sections.js"></script>
  <script src="store-renderer.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html { overflow-x: hidden; }

    body {
      background: var(--color-bg);
      color: var(--color-text);
      font-family: var(--font-body);
      overflow-x: hidden;
      width: 100%;
    }

    /* Nav */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 0 24px;
      height: 64px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
    }

    @media (min-width: 640px) { nav { padding: 0 40px; } }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--color-text);
    }

    .nav-logo-img {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      object-fit: cover;
      display: none;
    }

    .nav-logo-img.has-logo { display: block; }

    .nav-mark {
      font-family: var(--font-body);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .nav-links { display: flex; gap: 8px; align-items: center; }

    .nav-links a {
      font-size: 13px;
      color: var(--color-text);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 4px;
      opacity: 0.7;
      transition: opacity 0.15s, background 0.15s;
    }

    .nav-links a:hover { opacity: 1; background: var(--color-surface); }

    .nav-cart-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      background: var(--color-btn-bg);
      color: var(--color-btn-text);
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    .nav-cart-btn:hover { opacity: 0.85; }

    /* Hero banner — Shopify-style, no full-viewport takeover */
    .hero {
      background: var(--color-surface);
      padding: 80px 24px 72px;
      display: flex;
      align-items: center;
      min-height: 420px;
    }

    @media (min-width: 640px) { .hero { padding: 100px 40px 88px; min-height: 480px; } }

    .hero-content { max-width: 560px; }

    .hero-title {
      font-family: var(--font-hero);
      font-size: clamp(28px, 5vw, 52px);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      margin-bottom: 16px;
    }

    .hero-subtitle {
      font-size: clamp(14px, 2vw, 17px);
      line-height: 1.6;
      opacity: 0.65;
      margin-bottom: 32px;
      max-width: 440px;
    }

    .hero-btn {
      display: inline-block;
      background: var(--color-btn-bg);
      color: var(--color-btn-text);
      padding: 13px 28px;
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 0.01em;
      border: 2px solid var(--color-btn-bg);
      border-radius: 4px;
      transition: opacity 0.15s;
    }

    .hero-btn:hover { opacity: 0.85; }

    /* Shop section */
    .shop { padding: 80px 24px; }

    @media (min-width: 640px) { .shop { padding: 100px 40px; } }

    .shop-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 40px;
    }

    .shop-label {
      font-size: 9px;
      letter-spacing: 0.2em;
      opacity: 0.5;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .shop-title {
      font-family: var(--font-display);
      font-size: clamp(36px, 8vw, 80px);
      font-weight: 700;
      line-height: 1;
    }

    .shop-all-link {
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-text);
      text-decoration: none;
      opacity: 0.6;
      border-bottom: 1px solid var(--color-border-mid);
      padding-bottom: 2px;
      white-space: nowrap;
      transition: opacity 0.2s;
      flex-shrink: 0;
      margin-bottom: 6px;
    }

    .shop-all-link:hover { opacity: 1; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }

    .card { text-decoration: none; color: inherit; display: block; }

    .card-img {
      aspect-ratio: 3/4;
      background: var(--color-surface);
      overflow: hidden;
      border: 1px solid var(--color-surface-border);
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .card:hover .card-img img { transform: scale(1.04); }

    .card-info { padding: 12px 2px 4px; }

    .card-name {
      display: block;
      font-size: 10px;
      letter-spacing: 0.05em;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-price { display: block; font-size: 10px; opacity: 0.6; }

    /* Shop all CTA */
    .shop-cta { margin-top: 48px; text-align: center; }

    .shop-cta-btn {
      display: inline-block;
      font-family: var(--font-body);
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--color-btn-text);
      background: var(--color-btn-bg);
      text-decoration: none;
      padding: 14px 36px;
      border: 1px solid var(--color-btn-bg);
      transition: all 0.2s;
    }

    .shop-cta-btn:hover {
      background: var(--color-bg);
      color: var(--color-text);
      border-color: var(--color-border-mid);
    }

    /* Footer */
    footer {
      background: var(--color-footer-bg);
      color: var(--color-footer-text);
      padding: 60px 24px 36px;
    }

    @media (min-width: 640px) { footer { padding: 60px 40px 36px; } }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 40px;
      border-bottom: 1px solid var(--color-footer-border);
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 24px;
    }

    .footer-brand-name {
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 14px;
    }

    footer img { width: 200px; }

    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }

    .footer-links a {
      font-size: 10px;
      color: var(--color-footer-text);
      text-decoration: none;
      letter-spacing: 0.1em;
      opacity: 0.6;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .footer-links a:hover { opacity: 1; }

    .footer-copy { font-size: 9px; opacity: 0.4; letter-spacing: 0.05em; }
  </style>
</head>
<body>

  <!--
    The storefront is now driven entirely by store-renderer.js. It reads the
    saved schema (page_sections) from /settings/public and injects rendered
    sections into the canvas div below. The previous hardcoded nav / hero /
    shop / footer have been removed — they collided with the renderer output
    and were not editable from the theme editor.
  -->
  <div id="uc-editor-canvas"></div>

  <script src="cart.js"></script>
  <script>
    // Stripe success toast — runs independently of any rendered section.
    (function checkPaymentSuccess() {
      const params = new URLSearchParams(location.search);
      if (params.get('payment') !== 'success') return;
      clearCart();
      history.replaceState({}, '', location.pathname);
      const toast = document.createElement('div');
      toast.style.cssText = 'position:fixed;bottom:32px;left:50%;transform:translateX(-50%);' +
        'background:var(--color-footer-bg);color:var(--color-footer-text);' +
        'font-family:var(--font-body);font-size:10px;letter-spacing:0.1em;' +
        'text-transform:uppercase;padding:14px 28px;z-index:999;white-space:nowrap;' +
        'transition:opacity 0.5s';
      toast.textContent = 'Order confirmed — thank you!';
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; }, 3500);
      setTimeout(() => toast.remove(), 4200);
    })();
  </script>

</body>
</html>
